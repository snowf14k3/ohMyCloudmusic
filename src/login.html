<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>登录 - ohMyCloudmusic</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"Segoe UI",sans-serif;background:#1e1e2e;color:#cdd6f4;height:100vh;display:flex;flex-direction:column;user-select:none;-webkit-user-select:none;overflow:hidden}
#titlebar{height:32px;background:#181825;display:flex;align-items:center;justify-content:space-between;-webkit-app-region:drag;flex-shrink:0}
#titlebar span{padding-left:12px;font-size:13px;color:#a6adc8}
#close-btn{width:40px;height:32px;border:none;background:transparent;color:#a6adc8;cursor:pointer;display:flex;align-items:center;justify-content:center;-webkit-app-region:no-drag;transition:background .15s}
#close-btn:hover{background:#e81123;color:#fff}
.content{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
h2{font-size:16px;font-weight:500;margin-bottom:20px;color:#cdd6f4}
.qr-wrap{position:relative;width:200px;height:200px;margin-bottom:16px;border-radius:8px;overflow:hidden;background:#fff}
#qr-img{width:100%;height:100%;object-fit:contain}
.qr-mask{position:absolute;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(6px);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .2s}
.qr-mask.hidden{opacity:0;pointer-events:none}
.qr-mask p{font-size:13px;margin-bottom:8px;text-align:center;padding:0 12px}
#reload-btn{background:none;border:1px solid #89b4fa;color:#89b4fa;padding:6px 16px;border-radius:4px;cursor:pointer;font-size:12px}
#reload-btn:hover{background:#89b4fa;color:#1e1e2e}
#status{font-size:12px;color:#a6adc8;min-height:18px}
</style>
</head>
<body>
<div id="titlebar">
  <span>扫码登录</span>
  <button id="close-btn"><svg viewBox="0 0 10 10" width="10" height="10"><line x1="0" y1="0" x2="10" y2="10" stroke="currentColor" stroke-width="1.4"/><line x1="10" y1="0" x2="0" y2="10" stroke="currentColor" stroke-width="1.4"/></svg></button>
</div>
<div class="content">
  <h2>网易云音乐 App 扫码登录</h2>
  <div class="qr-wrap">
    <img id="qr-img" alt="QR Code">
    <div class="qr-mask" id="qr-mask">
      <p id="mask-text">正在生成二维码...</p>
      <button id="reload-btn" style="display:none">点击刷新</button>
    </div>
  </div>
  <div id="status"></div>
</div>
<script>
(function(){
  function poll(fn,ms,max){var t=0;var id=setInterval(function(){t+=ms;if(fn())clearInterval(id);else if(t>=max)clearInterval(id)},ms)}

  poll(function(){
    if(!window.__TAURI__)return false;
    init(window.__TAURI__);
    return true;
  },100,10000);

  function init(T){
    var invoke=T.core.invoke;
    var appWin=T.window.getCurrentWindow();

    document.getElementById('close-btn').onclick=function(){appWin.close()};
    document.getElementById('reload-btn').onclick=function(){startLogin(invoke)};

    startLogin(invoke);
  }

  function startLogin(invoke){
    var mask=document.getElementById('qr-mask');
    var maskText=document.getElementById('mask-text');
    var reloadBtn=document.getElementById('reload-btn');
    var qrImg=document.getElementById('qr-img');
    var statusEl=document.getElementById('status');

    mask.classList.remove('hidden');
    maskText.textContent='正在生成二维码...';
    reloadBtn.style.display='none';
    statusEl.textContent='';

    invoke('qr_generate').then(function(info){
      qrImg.src=info.qr_data_url;
      mask.classList.add('hidden');
      statusEl.textContent='请使用网易云音乐 App 扫描二维码';

      var checkId=setInterval(function(){
        invoke('qr_check',{unikey:info.unikey}).then(function(r){
          statusEl.textContent=r.message;
          if(r.status==='scanned'){
            mask.classList.remove('hidden');
            maskText.textContent='已扫描，请在手机上确认';
            reloadBtn.style.display='none';
          }else if(r.status==='authorized'){
            clearInterval(checkId);
            mask.classList.remove('hidden');
            maskText.textContent='登录成功！';
            reloadBtn.style.display='none';
            setTimeout(function(){
              invoke('on_login_success');
            },500);
          }else if(r.status==='expired'||r.status==='failed'){
            clearInterval(checkId);
            mask.classList.remove('hidden');
            maskText.textContent=r.message||'二维码已过期';
            reloadBtn.style.display='';
          }
        }).catch(function(e){
          clearInterval(checkId);
          mask.classList.remove('hidden');
          maskText.textContent='检查状态失败';
          reloadBtn.style.display='';
        });
      },2000);
    }).catch(function(e){
      maskText.textContent='生成二维码失败: '+e;
      reloadBtn.style.display='';
    });
  }
})();
</script>
</body>
</html>
